mnist_mlp:
  dataset: mnist
  model: mlp
  hidden_dims: [128]
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 60
  batch_size: 128
  trajectory_length: 5
  num_runs: 3

cifar10_conv8:
  dataset: cifar10
  model: conv8
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 60
  batch_size: 128
  trajectory_length: 30
  num_runs: 3

imagenet_resnet18:
  dataset: imagenet
  model: resnet18
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 90
  batch_size: 256 
  trajectory_length: 40
  num_runs: 3

imagenet_to_cars:
  dataset: cars
  pretrain_dataset: imagenet
  model: resnet18
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 64
  trajectory_length: 15
  num_runs: 3

imagenet_to_cub:
  dataset: cub200
  pretrain_dataset: imagenet
  model: resnet18
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 64
  trajectory_length: 15
  num_runs: 3

cifar10_to_cifar100:
  dataset: cifar100_subset
  pretrain_dataset: cifar10
  model: conv8
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 128
  trajectory_length: 15
  num_runs: 3

imagenet_10pct_to_cub:
  dataset: cub200
  pretrain_dataset: imagenet_10pct
  model: resnet18
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 64
  trajectory_length: 15
  num_runs: 1

imagenet_10pct_to_cars:
  dataset: cars
  pretrain_dataset: imagenet_10pct
  model: resnet18
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 64
  trajectory_length: 15
  num_runs: 1